# Supabase CLI configuration for Mais Jiu
# Linked to the pilot project documented in mcp-supabase-setup.md
project_id = "snjaaejvwlkgmyvgrmro"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Local dev only: email provider must be enabled for sign-in tests.
# Production/pilot keeps signup disabled via dashboard settings (ADR-005).
enable_signup = true

[auth.email]
# Local dev only: allow pre-created accounts to sign in.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
