<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mais Jiu — O Agora</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="device-stage">
    <div class="device-frame">
      <div class="status-bar">
        <span class="time">09:41</span>
        <div class="icons">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
        </div>
      </div>

      <div class="app-screen">
        <header class="app-header">
          <div>
            <p class="caption" style="margin:0;">Bom dia,</p>
            <h1 class="title">Rafael</h1>
          </div>
          <a class="btn-icon" href="search.html" aria-label="Buscar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          </a>
        </header>

        <main class="app-body hide-scroll">
          <div class="week-card" id="week-card">
            <span class="caption">Semana Atual</span>
            <h2 class="week-title">Passagem da meia-guarda</h2>
            <p class="week-date">29 jun – 05 jul</p>
          </div>

          <section aria-labelledby="week-label">
            <div style="display:flex; align-items:baseline; justify-content:space-between; padding:0 var(--space-4) var(--space-2);">
              <h2 id="week-label" class="heading">Técnicas da semana</h2>
              <span class="body-sm" id="video-count">0 vídeos</span>
            </div>
            <div class="carousel-wrap" id="carousel-wrap">
              <div class="carousel" id="carousel" role="list">
                <!-- cards rendered by JS -->
              </div>
            </div>
          </section>

          <section class="mt-6" aria-labelledby="library-label">
            <div style="padding:0 var(--space-4) var(--space-2);">
              <h2 id="library-label" class="heading">Explorar acervo</h2>
              <p class="body-sm mt-1">Busque por posição, finalização ou passagem.</p>
            </div>
            <div class="chip-row" id="chip-row">
              <!-- chips rendered by JS -->
            </div>
          </section>
        </main>

        <nav class="nav-bar">
          <a class="nav-item active" href="home.html" aria-label="Início">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Início</span>
          </a>
          <a class="nav-item" href="search.html" aria-label="Buscar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <span>Buscar</span>
          </a>
        </nav>
      </div>

      <div class="snackbar" id="snackbar" role="status"></div>
    </div>
  </div>

  <script>
    const videos = [
      { id: 'v1', title: 'Passagem básica da meia', tags: ['Passagem', 'Meia-guarda'], duration: '0:42', hue: 10 },
      { id: 'v2', title: 'Passagem com underhook', tags: ['Passagem', 'Meia-guarda'], duration: '0:55', hue: 30 },
      { id: 'v3', title: 'Estabilização no 100kg', tags: ['Passagem', 'Pesada'], duration: '0:38', hue: 50 },
      { id: 'v4', title: 'Finalização da montada', tags: ['Finalização', 'Montada'], duration: '0:47', hue: 340 },
      { id: 'v5', title: 'Recuperação de guarda', tags: ['Guarda', 'Defesa'], duration: '1:02', hue: 200 },
    ];

    const allTags = ['Passagem', 'Meia-guarda', 'Finalização', 'Montada', 'Guarda', 'Defesa', 'Raspagem', 'Estrangulamento'];

    const carousel = document.getElementById('carousel');
    const carouselWrap = document.getElementById('carousel-wrap');
    const chipRow = document.getElementById('chip-row');
    const videoCount = document.getElementById('video-count');
    const snackbar = document.getElementById('snackbar');

    /* Carousel affordance — kill the false-floor effect.           *
     * The ~33% peek of the 3rd card + the cream edge-fade is itself  *
     * the affordance (Instagram / Apple Music pattern). When the    *
     * user reaches scroll-end, the fade hides so the last card      *
     * isn't clipped by the gradient.                                */
    function updateCarouselState() {
      const maxScroll = carousel.scrollWidth - carousel.clientWidth;
      const x = carousel.scrollLeft;
      // 6px tolerance handles sub-pixel rounding on Android
      carouselWrap.classList.toggle('is-at-end', x >= maxScroll - 6);
    }

    carousel.addEventListener('scroll', updateCarouselState, { passive: true });
    requestAnimationFrame(updateCarouselState);
    window.addEventListener('resize', updateCarouselState, { passive: true });

    function showSnackbar(msg) {
      snackbar.textContent = msg;
      snackbar.classList.add('show');
      setTimeout(() => snackbar.classList.remove('show'), 2200);
    }

    function renderCards() {
      videoCount.textContent = `${videos.length} vídeos`;
      carousel.innerHTML = videos.map(v => `
        <article class="video-card" role="listitem" data-id="${v.id}">
          <div class="thumb" style="background: linear-gradient(135deg, hsl(${v.hue} 70% 28%), hsl(${v.hue} 60% 14%));">
            <div class="play">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </div>
            <span class="duration">${v.duration}</span>
          </div>
          <h3 class="card-title">${v.title}</h3>
          <div class="card-tags">
            ${v.tags.map(t => `<span class="tag">${t}</span>`).join('')}
          </div>
        </article>
      `).join('');

      carousel.querySelectorAll('.video-card').forEach(card => {
        card.addEventListener('click', () => {
          const id = card.dataset.id;
          window.location.href = `player.html?id=${id}`;
        });
      });
    }

    function renderChips() {
      chipRow.innerHTML = allTags.slice(0, 6).map(t => `
        <a class="tag" href="search.html?tag=${encodeURIComponent(t)}">${t}</a>
      `).join('');
    }

    renderCards();
    renderChips();
  </script>
</body>
</html>
