<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mais Jiu — Login</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="device-stage">
    <div class="device-frame">
      <div class="status-bar">
        <span class="time">09:41</span>
        <div class="icons">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
        </div>
      </div>

      <div class="app-screen">
        <div class="login-body">
          <div class="brand">
            <div class="brand-mark">MJ</div>
            <h1>Mais Jiu</h1>
            <p>Estudo ativo fora do tatame</p>
          </div>

          <form id="login-form" novalidate>
            <div class="field">
              <label for="user">Usuário</label>
              <input id="user" class="input" type="text" placeholder="seu.usuario" autocomplete="off" />
            </div>
            <div class="field mt-4">
              <label for="pass">Senha</label>
              <input id="pass" class="input" type="password" placeholder="••••••" />
              <p id="error" class="helper" aria-live="polite"></p>
            </div>
            <button type="submit" class="btn btn-primary btn-block mt-6">Entrar</button>
          </form>

          <p class="body-sm" style="text-align:center; margin-top:var(--space-4);">
            Contas pré-criadas pela academia.<br>
            <span style="color:var(--meta);">Dica: aluno / 123456</span>
          </p>
        </div>
      </div>

      <div class="snackbar" id="snackbar" role="status"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const userInput = document.getElementById('user');
    const passInput = document.getElementById('pass');
    const errorEl = document.getElementById('error');
    const snackbar = document.getElementById('snackbar');

    function showError(msg) {
      errorEl.textContent = msg;
      passInput.classList.add('error');
      userInput.classList.add('error');
    }

    function clearError() {
      errorEl.textContent = '';
      passInput.classList.remove('error');
      userInput.classList.remove('error');
    }

    function showSnackbar(msg) {
      snackbar.textContent = msg;
      snackbar.classList.add('show');
      setTimeout(() => snackbar.classList.remove('show'), 2200);
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      clearError();
      const user = userInput.value.trim();
      const pass = passInput.value.trim();

      if (!user || !pass) {
        showError('Preencha usuário e senha.');
        return;
      }

      if (user === 'aluno' && pass === '123456') {
        showSnackbar('Entrando...');
        setTimeout(() => { window.location.href = 'home.html'; }, 700);
      } else {
        showError('Credenciais inválidas. Tente aluno / 123456.');
      }
    });

    [userInput, passInput].forEach(el => el.addEventListener('input', clearError));
  </script>
</body>
</html>
