<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mais Jiu — Buscar</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="device-stage">
    <div class="device-frame">
      <div class="status-bar">
        <span class="time">09:41</span>
        <div class="icons">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
        </div>
      </div>

      <div class="app-screen">
        <header class="app-header">
          <a class="btn-icon" href="home.html" aria-label="Voltar">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
          </a>
          <h1 class="title">Biblioteca</h1>
          <div style="width:44px;"></div>
        </header>

        <main class="app-body no-pad hide-scroll">
          <div class="search-header">
            <div class="search-input-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
              <input id="search" type="text" placeholder="Buscar por tag (ex: Passagem)" autocomplete="off" />
            </div>
          </div>

          <div class="chip-row" id="chip-row"></div>

          <div class="feed" id="feed"></div>

          <div class="state" id="empty-state" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <h3>Nenhum vídeo encontrado</h3>
            <p class="body-sm">Tente outra tag ou selecione um dos chips acima.</p>
          </div>
        </main>

        <nav class="nav-bar">
          <a class="nav-item" href="home.html" aria-label="Início">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Início</span>
          </a>
          <a class="nav-item active" href="search.html" aria-label="Buscar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <span>Buscar</span>
          </a>
        </nav>
      </div>

      <div class="snackbar" id="snackbar" role="status"></div>
    </div>
  </div>

  <script>
    const videos = [
      { id: 'v1', title: 'Passagem básica da meia', tags: ['Passagem', 'Meia-guarda'], duration: '0:42', hue: 10 },
      { id: 'v2', title: 'Passagem com underhook', tags: ['Passagem', 'Meia-guarda'], duration: '0:55', hue: 30 },
      { id: 'v3', title: 'Estabilização no 100kg', tags: ['Passagem', 'Pesada'], duration: '0:38', hue: 50 },
      { id: 'v4', title: 'Finalização da montada', tags: ['Finalização', 'Montada'], duration: '0:47', hue: 340 },
      { id: 'v5', title: 'Recuperação de guarda', tags: ['Guarda', 'Defesa'], duration: '1:02', hue: 200 },
      { id: 'v6', title: 'Raspagem de beijo', tags: ['Raspagem', 'Meia-guarda'], duration: '0:49', hue: 260 },
      { id: 'v7', title: 'Estrangulamento de costas', tags: ['Finalização', 'Costas'], duration: '0:53', hue: 120 },
      { id: 'v8', title: 'Saida de 100kg', tags: ['Defesa', 'Pesada'], duration: '0:44', hue: 180 },
    ];

    const allTags = [...new Set(videos.flatMap(v => v.tags))].sort();

    const searchInput = document.getElementById('search');
    const chipRow = document.getElementById('chip-row');
    const feed = document.getElementById('feed');
    const emptyState = document.getElementById('empty-state');

    function normalize(str) {
      return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function renderChips(activeTag) {
      chipRow.innerHTML = allTags.map(t => {
        const active = normalize(t) === normalize(activeTag || '');
        return `<button class="tag ${active ? 'active' : ''}" data-tag="${t}">${t}</button>`;
      }).join('');

      chipRow.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          const tag = btn.dataset.tag;
          searchInput.value = tag;
          render(tag);
        });
      });
    }

    function render(query) {
      const q = normalize(query || '');
      const filtered = q
        ? videos.filter(v => v.tags.some(t => normalize(t).includes(q)))
        : videos;

      feed.innerHTML = filtered.map(v => `
        <article class="feed-item" data-id="${v.id}">
          <div class="thumb" style="background: linear-gradient(135deg, hsl(${v.hue} 70% 28%), hsl(${v.hue} 60% 14%));">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </div>
          <div class="meta">
            <h3 class="title">${v.title}</h3>
            <span class="caption">${v.duration}</span>
            <div class="tags">
              ${v.tags.map(t => `<span class="tag">${t}</span>`).join('')}
            </div>
          </div>
        </article>
      `).join('');

      feed.style.display = filtered.length ? 'flex' : 'none';
      emptyState.style.display = filtered.length ? 'none' : 'flex';

      feed.querySelectorAll('.feed-item').forEach(item => {
        item.addEventListener('click', () => {
          window.location.href = `player.html?id=${item.dataset.id}`;
        });
      });

      renderChips(query);
    }

    searchInput.addEventListener('input', (e) => render(e.target.value));

    const params = new URLSearchParams(window.location.search);
    const initialTag = params.get('tag') || '';
    searchInput.value = initialTag;
    render(initialTag);
  </script>
</body>
</html>
