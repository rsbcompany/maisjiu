<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mais Jiu — Player</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="device-stage">
    <div class="device-frame">
      <div class="status-bar">
        <span class="time">09:41</span>
        <div class="icons">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
        </div>
      </div>

      <div class="app-screen">
        <div class="reels-stage" id="reels-stage">
          <div class="reels-video" id="video-area">
            <div class="reels-scrim reels-scrim--top"></div>
            <div class="reels-scrim reels-scrim--bottom"></div>

            <div class="reels-top">
              <a class="reels-icon" href="home.html" aria-label="Voltar">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
              </a>
            </div>

            <button class="reels-play" id="btn-play" aria-label="Reproduzir">
              <svg id="icon-play" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              <svg id="icon-pause" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
            </button>

            <div class="reels-sheet" id="reels-sheet">
              <button class="reels-handle" id="btn-handle" aria-label="Expandir legenda" type="button"><span></span></button>
              <div class="reels-bottom">
                <div class="reels-meta">
                  <h1 class="reels-title" id="video-title">Carregando...</h1>
                  <div class="reels-tags" id="video-tags"></div>

                  <div class="reels-caption" id="reels-caption">
                    <div class="reels-decomp" id="caption-decomp"></div>
                    <ol class="reels-steps" id="caption-steps"></ol>
                    <button class="reels-more" id="btn-more" type="button">Ver mais</button>
                  </div>
                </div>
              </div>
            </div>

            <div class="reels-progress" id="reels-progress" role="slider" tabindex="0" aria-label="Progresso do vídeo" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="track"><div class="fill" id="progress-fill"></div></div>
            </div>
          </div>
        </div>
      </div>

      <div class="snackbar" id="snackbar" role="status"></div>
    </div>
  </div>

  <script>
    const videos = [
      {
        id: 'v1', title: 'Passagem básica da meia', tags: ['Passagem', 'Meia-guarda'], duration: 42, hue: 10,
        from: 'Meia-guarda', to: 'Montada',
        steps: [
          'Estabeleça o underhook no braço de dentro.',
          'Abaixe o quadril e empurre o joelho dele para o chão.',
          'Caminhe a mão do quadril para longe do oponente.',
          'Retire a perna de trás e complete a passagem.',
          'Consolide a montada segurando as lapela ou gola.'
        ],
        prompt: 'Qual detalhe de quadril impede que ele recomponha a meia?'
      },
      {
        id: 'v2', title: 'Passagem com underhook', tags: ['Passagem', 'Meia-guarda'], duration: 55, hue: 30,
        from: 'Meia-guarda', to: ['100kg', 'Montada'],
        steps: [
          'Segure o underhook profundo e agarre a cintura.',
          'Use a testa no peito para derrubar a postura dele.',
          'Esvazie a perna presa com um movimento de chicote.',
          'Pise no chão e avance o quadril para cima.',
          'Estabilize no 100kg antes de subir para a montada.'
        ],
        prompt: 'Como evitar que o oponente te derrube no lado do underhook?'
      },
      {
        id: 'v3', title: 'Estabilização no 100kg', tags: ['Passagem', 'Pesada'], duration: 38, hue: 50,
        from: 'Pós-passagem', to: '100kg controlada',
        steps: [
          'Mãos no chão ao lado da cabeça do oponente.',
          'Quadris baixos, barriga perto do chão.',
          'Cabeça baixa para não tomar grip na gola.',
          'Espalhe o peso pelos quadris e ombros.',
          'Controle os quadris dele sem cruzar suas mãos.'
        ],
        prompt: 'O que fazer quando ele tenta te puxar para a meia de volta?'
      },
      {
        id: 'v4', title: 'Finalização da montada', tags: ['Finalização', 'Montada'], duration: 47, hue: 340,
        from: 'Montada', to: 'Estrangulamento',
        steps: [
          'Segure a gola com a mão de dentro.',
          'Segunda mão entra por baixo do queixo.',
          'Cave o cotovelo para baixo do pescoço dele.',
          'Aproxime o peito da cabeça do oponente.',
          'Aperte e desça o quadril para finalizar.'
        ],
        prompt: 'Qual é o erro mais comum que deixa o estrangulamento frouxo?'
      },
      {
        id: 'v5', title: 'Recuperação de guarda', tags: ['Guarda', 'Defesa'], duration: 62, hue: 200,
        from: 'Sob a pesada', to: 'Guarda fechada',
        steps: [
          'Não deixe os braços cruzados; busque frames sólidos.',
          'Empurre o quadril para trás para criar espaço.',
          'Insira um joelho ou gancho entre vocês.',
          'Recupere a guarda fechada ou meia-guarda.',
          'Recompõe os grips antes de atacar.'
        ],
        prompt: 'Qual frame segura você usa quando está sendo esmagado?'
      },
      {
        id: 'v6', title: 'Raspagem de beijo', tags: ['Raspagem', 'Meia-guarda'], duration: 49, hue: 260,
        from: 'Meia-guarda de baixo', to: ['Guarda superior', '100kg'],
        steps: [
          'Cruze o braço dele para um grip na gola.',
          'Abra o quadril e coloque o cotovelo no chão.',
          'Use o joelho de baixo como alavanca.',
          'Rode para o lado do braço preso.',
          'Suba para a guarda superior ou 100kg invertida.'
        ],
        prompt: 'Qual ajuste de quadril impede que ele volte a passar?'
      },
      {
        id: 'v7', title: 'Estrangulamento de costas', tags: ['Finalização', 'Costas'], duration: 53, hue: 120,
        from: 'Costas', to: 'Finalização',
        steps: [
          'Segure a gola com a mão por baixo do pescoço.',
          'A outra mão passa por trás da cabeça dele.',
          'Feche o triângulo com os antebraços.',
          'Aproxime seu peito das costas dele.',
          'Puxe com os dois antebraços e finalize.'
        ],
        prompt: 'Como manter o gancho enquanto ajusta o estrangulamento?'
      },
      {
        id: 'v8', title: 'Saida de 100kg', tags: ['Defesa', 'Pesada'], duration: 44, hue: 180,
        from: 'Sob 100kg', to: 'Guarda recuperada',
        steps: [
          'Proteja o pescoço e mantenha os cotovelos juntos.',
          'Crie ângulo colocando um joelho no quadril dele.',
          'Empurre o quadril para o lado oposto.',
          'Recupere a meia-guarda ou guarda fechada.',
          'Recompõe a postura antes de atacar.'
        ],
        prompt: 'Qual erro faz você voltar a ficar plano sob a pesada?'
      }
    ];

    const params = new URLSearchParams(window.location.search);
    const id = params.get('id') || 'v1';
    const video = videos.find(v => v.id === id) || videos[0];

    document.getElementById('video-title').textContent = video.title;
    document.getElementById('video-tags').innerHTML = video.tags.map(t =>
      `<a class="reels-tag" href="search.html?tag=${encodeURIComponent(t)}">${t}</a>`
    ).join('');

    const captionEl = document.getElementById('reels-caption');
    const stepsEl = document.getElementById('caption-steps');
    const moreBtn = document.getElementById('btn-more');

    if (video.from && video.to) {
      const toText = Array.isArray(video.to) ? video.to.join(' / ') : video.to;
      document.getElementById('caption-decomp').innerHTML =
        `<span>De <strong>${video.from}</strong></span><span class="reels-arrow">→</span><span>para <strong>${toText}</strong></span>`;
    }

    if (video.steps && video.steps.length) {
      stepsEl.innerHTML = video.steps.map((s, i) =>
        `<li><span class="num">${i + 1}</span><span>${s}</span></li>`
      ).join('');
    }

    let expanded = false;
    function setExpanded(value) {
      expanded = value;
      captionEl.classList.toggle('is-expanded', expanded);
      moreBtn.textContent = expanded ? 'Ver menos' : 'Ver mais';
    }
    moreBtn.addEventListener('click', (e) => { e.stopPropagation(); setExpanded(!expanded); });

    const btnPlay = document.getElementById('btn-play');
    const iconPlay = document.getElementById('icon-play');
    const iconPause = document.getElementById('icon-pause');
    const fill = document.getElementById('progress-fill');
    const snackbar = document.getElementById('snackbar');
    const btnHandle = document.getElementById('btn-handle');
    const progressBar = document.getElementById('reels-progress');
    const videoArea = document.getElementById('video-area');

    let playing = false;
    let progress = 0;
    let viewed = false;
    let timer = null;
    let hidePlayTimer = null;

    function showSnackbar(msg) {
      snackbar.textContent = msg;
      snackbar.classList.add('show');
      setTimeout(() => snackbar.classList.remove('show'), 2400);
    }

    function updatePlayIcon() {
      iconPlay.style.display = playing ? 'none' : 'block';
      iconPause.style.display = playing ? 'block' : 'none';
      btnPlay.classList.toggle('is-playing', playing);
      clearTimeout(hidePlayTimer);
      if (playing) {
        hidePlayTimer = setTimeout(() => btnPlay.classList.add('is-hidden'), 900);
      } else {
        btnPlay.classList.remove('is-hidden');
      }
    }

    function togglePlay() {
      playing = !playing;
      updatePlayIcon();

      if (playing) {
        timer = setInterval(() => {
          progress += 100 / (video.duration * 10);
          if (progress >= 100) {
            progress = 100;
            clearInterval(timer);
            playing = false;
            updatePlayIcon();
          }
          fill.style.width = progress + '%';
          progressBar.setAttribute('aria-valuenow', Math.round(progress));

          if (!viewed && progress >= 50) {
            viewed = true;
            showSnackbar('Visualização registrada (50%)');
          }
        }, 100);
      } else {
        clearInterval(timer);
      }
    }

    function scrubProgress(e) {
      const rect = progressBar.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
      progress = ratio * 100;
      fill.style.width = progress + '%';
      progressBar.setAttribute('aria-valuenow', Math.round(progress));
      viewed = false;
    }

    btnPlay.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
    videoArea.addEventListener('click', togglePlay);
    btnHandle.addEventListener('click', (e) => { e.stopPropagation(); setExpanded(!expanded); });
    progressBar.addEventListener('click', (e) => { e.stopPropagation(); scrubProgress(e); });
    progressBar.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        e.stopPropagation();
        const delta = e.key === 'ArrowLeft' ? -5 : 5;
        progress = Math.min(100, Math.max(0, progress + delta));
        fill.style.width = progress + '%';
        progressBar.setAttribute('aria-valuenow', Math.round(progress));
        viewed = false;
      }
    });
  </script>
</body>
</html>
